<header class="nav-shell" [class.scrolled]="isScrolled">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="nav-container topbar-inner">
      <div class="topbar-left">
        <span class="dot"></span>
        <span class="topbar-message">
          Your website team — starting at $99/mo
        </span>
      </div>

      <a class="topbar-cta" (click)="navigateAndScroll('contact')">
        Get Free Mockup
      </a>
    </div>
  </div>

  <!-- MAIN NAV -->
  <div class="mainbar">
    <div class="nav-container">
      <div class="nav-inner">

        <!-- LOGO -->
        <a class="nav-logo" (click)="navigateAndScroll('home')">
          <img
            src="assets/logos/TWG-logo.png"
            alt="The Website Guys"
          />
        </a>

        <!-- DESKTOP LINKS -->
        <nav class="nav-links">
          <a (click)="navigateAndScroll('how-it-works')">How It Works</a>
          <a routerLink="/plans">Pricing</a>
        </nav>

        <!-- PRIMARY CTA -->
        <a class="nav-cta" (click)="navigateAndScroll('contact')">
           Quick Assessment
        </a>

        <!-- MOBILE TOGGLE -->
        <button
          class="nav-toggle"
          (click)="toggleMenu()"
          aria-label="Toggle menu">
          ☰
        </button>

      </div>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <a (click)="navigateAndScroll('how-it-works'); closeMenu()">How It Works</a>
    <a routerLink="/plans" (click)="closeMenu()">Pricing</a>

    <a
      class="mobile-cta"
      (click)="navigateAndScroll('contact'); closeMenu()">
      See if it’s a fit →
    </a>
  </div>

</header>
