<header class="header" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen"> 
  <!-- Logo -->
  <a routerLink="/" class="logo-link" title="Home">
    <img 
      src="assets/logos/logo.png" 
      alt="NY/NJ Cars For Cash Logo" 
      width="200" 
      class="logo-image"
      priority>
  </a>

  <!-- Desktop Nav -->
  <nav class="nav-island" [class.scrolled]="isScrolled">
    <div class="nav-links">
      <a (click)="scrollTo('services')">What We Do</a>
      <a (click)="scrollTo('how-it-works')">How We Build</a>
      <a (click)="scrollTo('faq')">FAQ</a>
    </div>
  </nav>

  <!-- CTA -->
  <a class="cta-button" (click)="scrollTo('contact')">Contact Us</a>

  <!-- Hamburger Toggle (mobile only) -->
  <div class="menu-toggle" (click)="toggleMenu()">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Dropdown Menu -->
  <div class="dropdown-menu" [class.open]="isMenuOpen">
    <a (click)="scrollTo('how-it-works'); toggleMenu()">How It Works</a>
    <a (click)="scrollTo('services'); toggleMenu()">Services</a>
    <a (click)="scrollTo('faq'); toggleMenu()">FAQ</a>
    <a (click)="scrollTo('contact'); toggleMenu()" class="mobile-cta">Contact Us</a>
  </div>
</header>
