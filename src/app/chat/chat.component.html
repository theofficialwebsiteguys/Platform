<div class="chat-container-wrapper">
    <div class="chat-sidebar">
      <h3>Participants</h3>
      <ul>
        <li>
          <img src="https://via.placeholder.com/40" alt="User 1" class="profile-pic" />
          <div class="user-info">
            <span class="user-name">User 1</span>
            <span class="user-status">Last active: 5m ago</span>
          </div>
        </li>
        <li>
          <img src="https://via.placeholder.com/40" alt="User 2" class="profile-pic" />
          <div class="user-info">
            <span class="user-name">User 2</span>
            <span class="user-status">Online</span>
          </div>
        </li>
      </ul>
    </div>
  
    <div class="chat-container">
        <div class="chat-messages" #chatMessagesContainer>
            <div
              *ngFor="let message of messages"
              class="message"
              [ngClass]="message.type"
            >
              <p>{{ message.text }}</p>
              <span class="timestamp">{{ message.timestamp }}</span>
            </div>
          </div>
          
  
      <div class="chat-input">
        <input
          type="text"
          placeholder="Write a message..."
          [(ngModel)]="newMessage"
        />
        <button (click)="sendMessage()">Send</button>
      </div>
    </div>
  </div>
